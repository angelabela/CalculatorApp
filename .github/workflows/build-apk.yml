name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract Android project
        run: |
          mkdir -p buildsrc
          ZIP=$(find . -maxdepth 1 -name "*.zip" -print -quit)
          echo "Using ZIP: $ZIP"
          unzip -q "$ZIP" -d buildsrc

      - name: Build APK
        working-directory: buildsrc
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NeonCalculatorPro-debug-apk
          path: buildsrc/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
