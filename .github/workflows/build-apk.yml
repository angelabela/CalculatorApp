name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract Android project
        run: |
          mkdir -p buildsrc

          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" -print -quit)

          echo "Using ZIP: $ZIP"

          unzip -q "$ZIP" -d buildsrc

          echo "Searching for Gradle project..."

          PROJECT_DIR=$(find buildsrc -name "settings.gradle" -o -name "settings.gradle.kts" | head -n 1 | xargs dirname)

          echo "Project directory: $PROJECT_DIR"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Cannot find settings.gradle"
            find buildsrc -maxdepth 5 -type f
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NeonCalculatorPro-debug-apk
          path: '${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk'
          if-no-files-found: error
